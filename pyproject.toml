[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-field-debugger"
version = "0.1.1"
description = "Standalone Modbus RTU capture analysis and 4-20 mA loop calculations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["modbus", "rtu", "4-20mA", "loop-calibrator", "field-instrumentation", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
pocket-debugger = "pocket_debugger.__main__:main"

[tool.setuptools.packages.find]
include = ["pocket_debugger*"]

[tool.setuptools.package-data]
pocket_debugger = ["report.html"]
